[project]
name = "specwright-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "appwrite>=6.0",
    "arq>=0.26",
    "docling>=2.0",
    # Pulled in by docling; listed so Linux can take the CPU builds (see tool.uv.sources).
    "torch",
    "torchvision",
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.60",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

# On Linux (CI), take PyTorch's CPU builds: the default ones pull in gigabytes of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
