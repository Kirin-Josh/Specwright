[project]
name = "specwright-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "appwrite>=6.0",
    "arq>=0.26",
    "docling>=2.0",
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.60",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
